<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeste: Los Llanos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div id="levelInfo">Nivel 1</div>
            <div id="stats">
                <span id="dashes">Saltos: 2</span>
                <span id="deaths">Muertes: 0</span>
            </div>
        </div>
    </div>

    <div id="menu" class="screen">
        <div class="menu-content">
            <h1>🐴 Celeste: Los Llanos 🌾</h1>
            <p>Un viaje a través de la magia de los Llanos Venezolanos</p>
            <button onclick="game.startGame()">JUGAR</button>
            <div class="controls">
                <p><strong>Controles:</strong></p>
                <p>⬅️➡️: Mover | ESPACIO: Saltar | Z: Dash</p>
                <p>⬆️: Escalar pared | R: Reiniciar</p>
            </div>
        </div>
    </div>

    <div id="levelComplete" class="screen">
        <div class="menu-content">
            <h1>🎉 ¡Nivel Completado!</h1>
            <p id="levelStats"></p>
            <button onclick="game.nextLevel()">Siguiente Nivel</button>
            <button onclick="game.backToMenu()">Menú Principal</button>
        </div>
    </div>

    <div id="gameOver" class="screen">
        <div class="menu-content">
            <h1>💀 Game Over</h1>
            <p id="gameOverStats"></p>
            <button onclick="game.startGame()">Intentar de Nuevo</button>
            <button onclick="game.backToMenu()">Menú Principal</button>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/player.js"></script>
    <script src="js/level.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
